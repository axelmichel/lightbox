# XcodeGen spec. Run `xcodegen` after changing it; Lightbox.xcodeproj is
# generated from this file. New package files need no change here.
name: Lightbox
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LightboxUI:
    path: Packages/LightboxUI
  LightboxCore:
    path: Packages/LightboxCore
  ComfyKit:
    path: Packages/ComfyKit
targets:
  Lightbox:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
    dependencies:
      - package: LightboxUI
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Lightbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]": YES
        "ENABLE_USER_SELECTED_FILES[sdk=macosx*]": readwrite
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
schemes:
  Lightbox:
    build:
      targets:
        Lightbox: all
